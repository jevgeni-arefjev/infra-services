---
  - name: Initial setup
    hosts: all
    roles:
      - init
    gather_facts: yes
    tags:
      - always

  - name: DNS servers
    hosts: dns_servers
    roles:
      - bind
    tags:
      - b

  - name: Database servers
    hosts: db_servers
    roles:
      - mysql
    tags:
      - d

  - name: Web servers
    hosts: web_servers
    roles:
      - agama
      - uwsgi
      - nginx
    tags:
      - w

  - name: Prometheus
    hosts: prometheus
    roles:
      - nginx
      - prometheus
    tags:
      - p

  - name: Grafana
    hosts: grafana
    roles:
      - grafana
    tags:
      - g
  
  - name: Loki
    hosts: loki
    roles:
      - loki
    tags:
      - l
