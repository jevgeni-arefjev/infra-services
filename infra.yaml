---
  - name: Initial setup
    hosts: all
    roles:
      - init
    gather_facts: yes
    tags:
      - always

  # DNS should always go first because of nsupdates
  - name: DNS servers
    hosts: dns_servers
    roles:
      - bind
    tags:
      - dns

  - name: Database servers
    hosts: db_servers
    roles:
      - mysql
    tags:
      - db

  - name: Web Apps
    hosts: web_apps
    roles:
      - docker
      - agama
    tags:
      - apps

  - name: Web servers
    hosts: web_servers
    roles:
      - nginx
    tags:
      - www

  - name: Prometheus
    hosts: prometheus
    roles:
      - nginx
      - prometheus
    tags:
      - p

  - name: Grafana
    hosts: grafana
    roles:
      - docker
      - grafana
    tags:
      - g
  
  - name: Loki
    hosts: loki
    roles:
      - loki
    tags:
      - l

  - name: HA
    hosts: haproxy
    roles:
      - keepalived
      - haproxy
    tags:
      - ha
