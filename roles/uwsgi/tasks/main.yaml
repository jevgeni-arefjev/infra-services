- name: Install uWSGI packages
  ansible.builtin.apt:
    name:
      - uwsgi
      - uwsgi-plugin-python3

- name: Create repository /etc/uwsgi/apps-enabled
  ansible.builtin.file:
    path: /etc/uwsgi/apps-enabled
    state: directory

- name: Add uWSGI app Agama configuration
  ansible.builtin.template:
    src: agama.ini.j2
    dest: /etc/uwsgi/apps-enabled/agama.ini
    owner: agama
    mode: 0400
  no_log: true
  notify: Restart uWSGI

- name: uWSGI service
  ansible.builtin.service:
    name: uwsgi
    state: started
    enabled: true

