- name: Install Prometheus
  ansible.builtin.apt:
    name: prometheus
    policy_rc_d: 101

- name: Update Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
  notify: Restart Prometheus

- name: Adjust Prometheus service
  ansible.builtin.template:
    src: prometheus.j2
    dest: /etc/default/prometheus
  notify: Restart Prometheus

- name: Prometheus service
  ansible.builtin.service:
    name: prometheus
    state: started
    enabled: true

- name: Add cron backuping schedule
  ansible.builtin.template:
    src: backup-cron.j2
    dest: /etc/cron.d/prometheus-backup

- name: Create DNS CNAME record for Prometheus server
  community.general.nsupdate:
    server: "{{ hostvars[item]['ansible_default_ipv4']['address'] }}"
    key_algorithm: "hmac-sha256"
    key_name: "nsupdate."
    key_secret: "{{ nsupdate_key }}"
    type: "CNAME"
    zone: "{{ startup_domain }}"
    record: "prometheus"
    value: "{{ inventory_hostname }}"
  loop: "{{ groups['dns_primary'] }}"

