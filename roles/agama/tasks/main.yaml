- name: Create directory /opt/agama
  ansible.builtin.file:
    path: /opt/agama
    state: directory

- name: Install agama app
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/hudolejev/agama/main/{{ item }}"
    dest: "/opt/agama/{{ item }}"
  loop:
    - agama.py
    - Dockerfile

- name: Build Agama Docker image
  community.docker.docker_image:
    name: agama
    source: build
    build:
      path: /opt/agama

- name: Start Agama
  community.docker.docker_container:
    image: agama
    name: agama
    state: started
    env:
      "AGAMA_DATABASE_URI=mysql+pymysql://{{ mysql_user }}:{{ mysql_password }}@{{ mysql_host }}/{{ mysql_database }}"
    published_ports: "{{ agama_port }}:8000"
    log_driver: grafana/loki-docker-driver
    log_options:
      loki-url: http://jevgeni-arefjev-1:3100/loki/api/v1/push